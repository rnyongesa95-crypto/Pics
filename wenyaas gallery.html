<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Album</title>
<style>
  :root {
    --bg: #14110f;
    --card: #1e1a17;
    --accent: #c9925a;
    --text: #f2ede6;
    --muted: #9a8f84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  header {
    padding: 48px 20px 24px;
    text-align: center;
  }
  header h1 {
    font-size: 2rem;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }
  header p {
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px clamp(16px, 5vw, 60px) 60px;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2c2622;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    background: #0d0b0a;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    font-family: Arial, sans-serif;
  }
  .card-footer span {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .card-footer a {
    text-decoration: none;
    color: var(--bg);
    background: var(--accent);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
  }
  .card-footer a:active {
    opacity: 0.8;
  }
</style>
</head>
<body>

<header>
  <h1>Wenyaa's Family Album</h1>
  <p>Tap "Save" under any photo to download it</p>
</header>

<div class="grid" id="gallery"></div>

<script>
  // List your photo filenames here.
  // Make sure these image files sit in the SAME folder as this HTML file.
  const photos = [
    "P1.jpg","P2.jpg","P3.jpg","P4.png","P5.jpg",
    "P6.jpg","P7.jpg","P8.jpg","P9.jpg","P10.jpg",
    "P11.jpg","P12.jpg","P13.jpg","P14.jpg","P15.jpg"
  ];

  const pics = document.getElementById("gallery");

  photos.forEach(filename => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${filename}" alt="${filename}" loading="lazy">
      <div class="card-footer">
        <span>${filename}</span>
        <a href="${filename}" download="${filename}">Save</a>
      </div>
    `;
    gallery.appendChild(card);
  });
</script>

</body>
</html>
